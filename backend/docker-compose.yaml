version: '3'
services:
  mongo:
    image: mongo:8
    ports:
      - 27017:27017
    networks:
      - salon-network

  server:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    command: npm run docker-dev
    restart: always
    environment:
      MongoConnectionString: mongodb://mongo:27017
    ports:
      - 3001:3000
      - 9229:9229
    networks:
      - salon-network
    depends_on:
      - mongo
    develop:
      watch:
        - action: sync
          path: ./
          target: /app
          initial_sync: true
          ignore:
            - node_modules
        - action: rebuild
          path: package.json

networks:
  salon-network:
    driver: bridge
